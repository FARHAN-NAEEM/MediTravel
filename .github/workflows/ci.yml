name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: ahc_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, ctype, fileinfo, gd, intl, mbstring, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit dependency security
        run: |
          composer audit --locked
          npm audit --audit-level=moderate

      - name: Build production assets
        run: npm run build

      - name: Check patch formatting
        run: git diff --check

      - name: Run application tests
        run: php artisan test

      - name: Verify MySQL migrations and referral rollback
        env:
          APP_ENV: testing
          APP_KEY: base64:9hJmrfZkknYBPSOMC0QwzlQ8vJCVkM7AOgGKj9s1VJg=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: ahc_migration_test
          DB_USERNAME: root
          DB_PASSWORD: ci-only-password
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: |
          php artisan migrate --force
          APP_ENV=production APP_DEBUG=false APP_URL=https://example.test SESSION_SECURE_COOKIE=true php scripts/deployment-preflight.php
          php artisan migrate:rollback --step=1 --force
          php artisan migrate --force
